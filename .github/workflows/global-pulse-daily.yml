# Ciclo diario Global Pulse — orquestacion sin n8n.
# Ejecuta el pipeline (modo live) cada dia a las 05:00 UTC y publica el pulso.
name: global-pulse-daily

on:
  push:
    paths:
      - 'global-pulse/pipeline/**'
      - '.github/workflows/global-pulse-daily.yml'
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de ingesta"
        default: "live"
        type: choice
        options: [live, fixture]

permissions:
  contents: write

concurrency:
  group: global-pulse-daily
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias de pruebas de investigación
        run: python -m pip install python-dotenv==1.0.1 tenacity==8.3.0 cachetools==5.3.3

      - name: Tests del pipeline
        working-directory: global-pulse/pipeline
        run: python -m unittest discover -s tests -p 'test_*.py' && python -m tests.test_pipeline

      - name: Verificar acceso a OpenAI
        if: github.event.inputs.mode != 'fixture'
        working-directory: global-pulse/pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -c "import json; from gp.openai_client import respond; result = json.loads(respond('Devuelve JSON con ok igual a true.', 'Prueba de conectividad JSON, sin noticias.', max_tokens=32)); assert result.get('ok') is True; print('OpenAI Responses: conexión verificada')"

      - name: Ejecutar ciclo diario de fuentes y medios
        if: github.event.inputs.mode != 'fixture'
        working-directory: global-pulse/pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          for attempt in 1 2 3; do
            python orchestrator.py run --mode live --synth auto && exit 0
            if [ "$attempt" -lt 3 ]; then sleep 60; fi
          done
          exit 1

      - name: Publicar pulso (commit)
        if: always() && github.event.inputs.mode != 'fixture'
        run: |
          git config user.name "global-pulse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add global-pulse/data global-pulse/app/public/data
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "pulse: ciclo diario $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
